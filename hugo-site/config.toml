baseURL = "https://example.com"
languageCode = "ja"
title = "AI × 不動産 自動ブログ"
theme = "PaperMod"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
summaryLength = 120
timeZone = "Asia/Tokyo"

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[services]
  [services.googleAnalytics]
    ID = ""

[params]
  env = "production"
  title = "AI × 不動産 自動ブログ"
  description = "AI、Python自動化、不動産投資、業務効率化をテーマにした自動更新ブログです。"
  keywords = ["AI", "不動産", "不動産投資", "Python", "自動化", "業務効率化"]
  author = "太田ひろし"
  DateFormat = "2006年1月2日"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  comments = false
  images = ["/images/ogp.png"]

  [params.assets]
    disableHLJS = false

  [params.label]
    text = "AI × 不動産 自動ブログ"

  [params.homeInfoParams]
    Title = "AI × 不動産 自動ブログ"
    Content = "AI、Python自動化、不動産投資をわかりやすく解説する自動更新ブログです。"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[[menu.main]]
  identifier = "posts"
  name = "記事一覧"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "タグ"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "categories"
  name = "カテゴリ"
  url = "/categories/"
  weight = 30
