name: Ruff Autofix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.8,<1'

      - name: Apply safe Ruff fixes and formatting
        run: |
          ruff check \
            affiliate_agent \
            tests/test_affiliate_agent.py \
            tests/test_a8_ecsales.py \
            tests/test_a8_cli.py \
            --fix
          ruff format \
            affiliate_agent \
            tests/test_affiliate_agent.py \
            tests/test_a8_ecsales.py \
            tests/test_a8_cli.py
          ruff check \
            affiliate_agent \
            tests/test_affiliate_agent.py \
            tests/test_a8_ecsales.py \
            tests/test_a8_cli.py

      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            echo 'No Ruff changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            affiliate_agent \
            tests/test_affiliate_agent.py \
            tests/test_a8_ecsales.py \
            tests/test_a8_cli.py
          git commit -m 'style: apply Ruff autofix'
          git push origin HEAD:main
