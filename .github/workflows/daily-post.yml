name: Validate Blog and Affiliate Agent

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Static check for maintained affiliate code
        run: ruff check affiliate_agent tests/test_affiliate_agent.py

      - name: Python tests
        run: pytest

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Build all Hugo sites
        shell: bash
        run: |
          set -euo pipefail
          for site in sites/*; do
            if [[ -f "$site/hugo.toml" ]]; then
              hugo --source "$site" --gc --minify
            fi
          done

      - name: Deployment responsibility
        run: echo "Cloudflare Pages deploys production from the GitHub main branch; this workflow validates code and builds only."
