name: Daily Post Builder and Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # Setup Node for Wrangler
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # AI Tech Blog
      - name: Build AI Tech Site
        run: cd sites/ai-tech && hugo --minify

      - name: Deploy AI Tech to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/ai-tech/public --project-name="ai-tech-blog" --commit-dirty=true

      # Real Estate Blog
      - name: Build Real Estate Site
        run: cd sites/real-estate && hugo --minify

      - name: Deploy Real Estate to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/real-estate/public --project-name="real-estate-blog" --commit-dirty=true

      # Business Blog
      - name: Build Business Site
        run: cd sites/business && hugo --minify

      - name: Deploy Business to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/business/public --project-name="business-blog" --commit-dirty=true
