<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc">
  <title id="title">Hugo ビルドと PaperMod の流れ</title>
  <desc id="desc">Hugo が Markdown、config、theme、static を読み込んで public を作る流れ</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#16a34a"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.input{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:16}.hugo{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:20}.out{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:16}.txt{font:700 19px system-ui,sans-serif;fill:#0f172a}.code{font:600 15px ui-monospace,Consolas,monospace;fill:#334155}.arrow{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1450" height="900"/>
  <text x="60" y="65" class="title">Hugo ビルドの中で何が起きるか</text>
  <text x="60" y="98" class="small">Markdown記事、サイト設定、PaperModテーマ、staticファイルをHugoが統合し、Cloudflare Pagesが配信できる public/ を作ります。</text>

  <rect x="80" y="165" width="310" height="95" class="input"/><text x="115" y="202" class="txt">content/posts/*.md</text><text x="115" y="230" class="small">front matter + 本文</text>
  <rect x="80" y="315" width="310" height="95" class="input"/><text x="115" y="352" class="txt">config.toml</text><text x="115" y="380" class="small">日本語、SEO、RSS、sitemap</text>
  <rect x="80" y="465" width="310" height="95" class="input"/><text x="115" y="502" class="txt">themes/PaperMod</text><text x="115" y="530" class="small">レイアウト、CSS、ダークモード</text>
  <rect x="80" y="615" width="310" height="95" class="input"/><text x="115" y="652" class="txt">static/</text><text x="115" y="680" class="small">画像、OGP素材、固定ファイル</text>

  <rect x="565" y="270" width="360" height="280" class="hugo"/>
  <text x="625" y="322" class="txt">Hugo Extended</text>
  <text x="625" y="360" class="code">hugo --source hugo-site</text>
  <text x="625" y="388" class="code">--gc --minify</text>
  <text x="625" y="435" class="small">1. Markdown をHTMLへ変換</text>
  <text x="625" y="465" class="small">2. PaperMod レイアウトを適用</text>
  <text x="625" y="495" class="small">3. sitemap.xml / index.xml を生成</text>
  <text x="625" y="525" class="small">4. CSS/HTMLを軽量化</text>

  <rect x="1100" y="180" width="290" height="100" class="out"/><text x="1135" y="218" class="txt">public/index.html</text><text x="1135" y="248" class="small">トップページ</text>
  <rect x="1100" y="330" width="290" height="100" class="out"/><text x="1135" y="368" class="txt">public/posts/</text><text x="1135" y="398" class="small">記事ページ</text>
  <rect x="1100" y="480" width="290" height="100" class="out"/><text x="1135" y="518" class="txt">index.xml</text><text x="1135" y="548" class="small">RSSフィード</text>
  <rect x="1100" y="630" width="290" height="100" class="out"/><text x="1135" y="668" class="txt">sitemap.xml</text><text x="1135" y="698" class="small">検索エンジン向けURL一覧</text>

  <path d="M390 212 C480 212 500 330 565 330" class="arrow"/>
  <path d="M390 362 L565 385" class="arrow"/>
  <path d="M390 512 C480 512 500 465 565 465" class="arrow"/>
  <path d="M390 662 C500 662 505 525 565 525" class="arrow"/>
  <path d="M925 350 C990 300 1030 230 1100 230" class="arrow"/>
  <path d="M925 390 C990 390 1030 380 1100 380" class="arrow"/>
  <path d="M925 455 C990 480 1030 530 1100 530" class="arrow"/>
  <path d="M925 510 C990 580 1030 680 1100 680" class="arrow"/>

  <rect x="170" y="770" width="1110" height="60" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="14"/>
  <text x="205" y="805" class="small">Cloudflare Pages では Build output directory に hugo-site/public を指定します。この中身がそのままCDN配信されます。</text>
</svg>
