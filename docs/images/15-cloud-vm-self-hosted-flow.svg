<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc"><title id="title">GitHub Actions以外のクラウドVM実行フロー</title><desc id="desc">self-hosted runnerやクラウドVMでCloud Modeを実行する流れ</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#0891b2"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.vm{fill:#ecfeff;stroke:#0891b2;stroke-width:3;rx:16}.repo{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:16}.run{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:16}.out{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:16}.txt{font:700 19px system-ui,sans-serif;fill:#0f172a}.code{font:600 15px ui-monospace,Consolas,monospace;fill:#334155}.arrow{stroke:#0891b2;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs><rect class="bg" width="1450" height="900"/><text x="60" y="65" class="title">GitHub Actions以外のクラウドVM / self-hosted runner でも実行可能</text><text x="60" y="98" class="small">GitHub Actionsに限定せず、任意のLinux VMやself-hosted runnerでも同じCloud Modeスクリプトを使えます。</text>
<rect x="80" y="170" width="320" height="110" class="vm"/><text x="115" y="210" class="txt">1. Cloud VM</text><text x="115" y="240" class="small">Ubuntu VM / self-hosted runner</text><text x="115" y="264" class="small">cronやsystemd timerで起動可能</text>
<rect x="530" y="170" width="320" height="110" class="repo"/><text x="565" y="210" class="txt">2. clone</text><text x="565" y="240" class="code">git clone --recursive</text><text x="565" y="264" class="small">repoをクラウド上へ配置</text>
<rect x="980" y="170" width="320" height="110" class="run"/><text x="1015" y="210" class="txt">3. runtime setup</text><text x="1015" y="240" class="small">Python / Hugo / AI CLI</text><text x="1015" y="264" class="small">CLI認証をVM側で管理</text>
<rect x="80" y="425" width="320" height="120" class="run"/><text x="115" y="465" class="txt">4. prepare</text><text x="115" y="495" class="code">bash scripts/cloud_prepare_ai_cli.sh</text><text x="115" y="520" class="small">CLI存在確認</text>
<rect x="530" y="425" width="320" height="120" class="run"/><text x="565" y="465" class="txt">5. generate</text><text x="565" y="495" class="code">bash scripts/cloud_generate.sh</text><text x="565" y="520" class="small">記事生成・commit・push</text>
<rect x="980" y="425" width="320" height="120" class="out"/><text x="1015" y="465" class="txt">6. deploy</text><text x="1015" y="495" class="small">Cloudflare Pagesがpushを検知</text><text x="1015" y="520" class="small">またはDeploy Hookを呼ぶ</text>
<path d="M400 225 L530 225" class="arrow"/><path d="M850 225 L980 225" class="arrow"/><path d="M1140 280 C1140 360 240 350 240 425" class="arrow"/><path d="M400 485 L530 485" class="arrow"/><path d="M850 485 L980 485" class="arrow"/>
<rect x="150" y="690" width="1150" height="90" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="16"/><text x="185" y="730" class="txt">使い分け</text><text x="340" y="730" class="small">GitHub Actions: 管理が簡単。Secretsとworkflowで完結。</text><text x="340" y="758" class="small">Cloud VM/self-hosted: CLIの永続ログインや独自ネットワークが必要な場合に向く。</text></svg>