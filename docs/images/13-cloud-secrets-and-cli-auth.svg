<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">Cloud Secrets と AI CLI 認証の流れ</title><desc id="desc">GitHub Secretsがrunner環境変数になりCLIプロセスへ渡るがPythonはAPIを直接呼ばない</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#ea580c"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.secret{fill:#fff1f2;stroke:#e11d48;stroke-width:3;rx:16}.env{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3;rx:16}.script{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:16}.cli{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:16}.txt{font:700 19px system-ui,sans-serif;fill:#0f172a}.code{font:600 15px ui-monospace,Consolas,monospace;fill:#334155}.arrow{stroke:#ea580c;stroke-width:4;fill:none;marker-end:url(#arrow)}.no{stroke:#e11d48;stroke-width:6}.cross{font:900 38px system-ui,sans-serif;fill:#e11d48}</style></defs><rect class="bg" width="1500" height="900"/><text x="60" y="65" class="title">Cloud Mode の Secrets と CLI 認証</text><text x="60" y="98" class="small">Secrets は runner の環境変数になり、CLI プロセスに渡されます。Python はその値を使って AI API を直接呼びません。</text>
<rect x="75" y="170" width="330" height="180" class="secret"/><text x="110" y="210" class="txt">GitHub Secrets</text><text x="110" y="245" class="code">CLOUD_AI_CLI_INSTALL_COMMANDS</text><text x="110" y="272" class="code">CLAUDE_CONFIG</text><text x="110" y="299" class="code">GEMINI_API_KEY</text><text x="110" y="326" class="code">CODEX_AUTH_JSON</text>
<rect x="520" y="170" width="330" height="180" class="env"/><text x="555" y="210" class="txt">Runner Environment</text><text x="555" y="245" class="small">workflow の env として注入</text><text x="555" y="272" class="small">ログにはsecret値を出さない</text><text x="555" y="299" class="small">必要なCLIだけが参照</text>
<rect x="965" y="170" width="330" height="180" class="script"/><text x="1000" y="210" class="txt">cloud_prepare_ai_cli.sh</text><text x="1000" y="245" class="small">install commandを実行</text><text x="1000" y="272" class="small">claude/gemini/codex の存在確認</text><text x="1000" y="299" class="small">なければ分かるログを出す</text>
<rect x="300" y="510" width="330" height="170" class="script"/><text x="335" y="550" class="txt">generate.py --cloud</text><text x="335" y="585" class="small">プロンプトを作り subprocess 実行</text><text x="335" y="612" class="small">API SDK import なし</text><text x="335" y="639" class="small">HTTP API呼び出しなし</text>
<rect x="815" y="510" width="330" height="170" class="cli"/><text x="850" y="550" class="txt">AI CLI Process</text><text x="850" y="585" class="code">claude -p prompt</text><text x="850" y="612" class="code">gemini -p prompt</text><text x="850" y="639" class="code">codex -q prompt</text>
<path d="M405 260 L520 260" class="arrow"/><path d="M850 260 L965 260" class="arrow"/><path d="M1130 350 C1130 440 500 430 465 510" class="arrow"/><path d="M630 595 L815 595" class="arrow"/>
<line x1="675" y1="745" x2="825" y2="825" class="no"/><line x1="825" y1="745" x2="675" y2="825" class="no"/><text x="535" y="805" class="txt">禁止: Python から AI API を直接呼ぶ</text>
<rect x="1000" y="735" width="350" height="70" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="14"/><text x="1030" y="778" class="small">CLI認証方式は使うCLIごとに異なるため、Secret名は受け皿として用意しています。</text></svg>