<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc"><title id="title">リファクタリング後の generator モジュール構成</title><desc id="desc">generate.py を責務別モジュールへ分割した構成</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#16a34a"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.core{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:18}.mod{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:16}.cloud{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3;rx:16}.out{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:16}.txt{font:700 19px system-ui,sans-serif;fill:#0f172a}.code{font:600 15px ui-monospace,Consolas,monospace;fill:#334155}.arrow{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#arrow)}.blue{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs><rect class="bg" width="1500" height="920"/><text x="60" y="65" class="title">リファクタリング後: generator モジュール構成</text><text x="60" y="98" class="small">肥大化していた generate.py を薄いオーケストレーション層にし、CLI・Markdown・Git・Cloud・設定読み込みを分離しました。</text>
<rect x="560" y="155" width="380" height="125" class="core"/><text x="605" y="198" class="txt">generator/generate.py</text><text x="605" y="230" class="small">処理順序だけを制御</text><text x="605" y="254" class="small">Local / Cloud 共通入口</text>
<rect x="95" y="360" width="300" height="100" class="mod"/><text x="130" y="398" class="txt">config_loader.py</text><text x="130" y="428" class="small">YAML / topics / state</text>
<rect x="440" y="360" width="300" height="100" class="mod"/><text x="475" y="398" class="txt">cli_runner.py</text><text x="475" y="428" class="small">AI CLI subprocess</text>
<rect x="785" y="360" width="300" height="100" class="mod"/><text x="820" y="398" class="txt">markdown_post.py</text><text x="820" y="428" class="small">front matter / slug / save</text>
<rect x="1130" y="360" width="300" height="100" class="mod"/><text x="1165" y="398" class="txt">git_ops.py</text><text x="1165" y="428" class="small">commit / push / retry</text>
<rect x="270" y="600" width="300" height="100" class="cloud"/><text x="305" y="638" class="txt">cloud.py</text><text x="305" y="668" class="small">Cloud Mode 判定</text>
<rect x="615" y="600" width="300" height="100" class="out"/><text x="650" y="638" class="txt">runtime.py</text><text x="650" y="668" class="small">JST / logging / repo root</text>
<rect x="960" y="600" width="300" height="100" class="out"/><text x="995" y="638" class="txt">models.py</text><text x="995" y="668" class="small">Topic / CliResult</text>
<path d="M650 280 C520 315 340 330 245 360" class="arrow"/><path d="M690 280 L590 360" class="arrow"/><path d="M790 280 L935 360" class="arrow"/><path d="M850 280 C1000 315 1190 330 1280 360" class="arrow"/><path d="M650 280 C535 430 465 500 420 600" class="arrow"/><path d="M750 280 L765 600" class="arrow"/><path d="M850 280 C925 430 1000 500 1110 600" class="arrow"/>
<rect x="170" y="775" width="1160" height="65" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="14"/><text x="205" y="815" class="small">効果: テストしやすく、変更箇所が明確になり、Local Mode と Cloud Mode の共通ロジックを安全に保てます。</text></svg>