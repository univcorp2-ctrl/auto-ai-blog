<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">git commit push から Cloudflare Pages 公開まで</title>
  <desc id="desc">生成記事が GitHub に push され Cloudflare Pages でデプロイされる流れ</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#ea580c"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.local{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:16}.git{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3;rx:16}.cf{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:16}.web{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:16}.txt{font:700 19px system-ui,sans-serif;fill:#0f172a}.code{font:600 15px ui-monospace,Consolas,monospace;fill:#334155}.arrow{stroke:#ea580c;stroke-width:4;fill:none;marker-end:url(#arrow)}.retry{stroke:#e11d48;stroke-width:4;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1500" height="900"/>
  <text x="60" y="65" class="title">記事保存後: git push から Cloudflare Pages 公開まで</text>
  <text x="60" y="98" class="small">generate.py が保存した記事は GitHub に push され、Cloudflare Pages が main ブランチ更新を検知して自動公開します。</text>

  <rect x="70" y="165" width="310" height="115" class="local"/><text x="105" y="205" class="txt">1. Markdown保存</text><text x="105" y="235" class="code">hugo-site/content/posts/</text><text x="105" y="260" class="small">front matter 付き記事</text>
  <rect x="470" y="165" width="310" height="115" class="local"/><text x="505" y="205" class="txt">2. git add</text><text x="505" y="235" class="code">git add posts/ .state.json</text><text x="505" y="260" class="small">記事と状態ファイルを対象化</text>
  <rect x="870" y="165" width="310" height="115" class="local"/><text x="905" y="205" class="txt">3. git commit</text><text x="905" y="235" class="code">📝 新記事: {title}</text><text x="905" y="260" class="small">記事タイトルを含めて履歴化</text>
  <rect x="470" y="375" width="310" height="120" class="git"/><text x="505" y="415" class="txt">4. git push</text><text x="505" y="445" class="code">git push origin main</text><text x="505" y="470" class="small">失敗時は最大3回・5秒間隔で再試行</text>
  <rect x="870" y="375" width="310" height="120" class="git"/><text x="905" y="415" class="txt">5. GitHub Repository</text><text x="905" y="445" class="small">main ブランチに変更が入る</text><text x="905" y="470" class="small">記事、Hugo設定、画像、docs を管理</text>
  <rect x="470" y="610" width="310" height="120" class="cf"/><text x="505" y="650" class="txt">6. Cloudflare Pages</text><text x="505" y="680" class="small">GitHub の更新を検知</text><text x="505" y="705" class="small">Hugo build command を実行</text>
  <rect x="870" y="610" width="310" height="120" class="web"/><text x="905" y="650" class="txt">7. 公開サイト</text><text x="905" y="680" class="small">HTML / RSS / sitemap がCDN配信</text><text x="905" y="705" class="small">検索エンジンと読者へ届く</text>

  <path d="M380 222 L470 222" class="arrow"/><path d="M780 222 L870 222" class="arrow"/><path d="M1025 280 C1025 335 625 315 625 375" class="arrow"/><path d="M780 435 L870 435" class="arrow"/><path d="M625 495 L625 610" class="arrow"/><path d="M780 670 L870 670" class="arrow"/>
  <path d="M625 375 C350 380 350 520 625 520 C900 520 900 375 625 375" class="retry"/>
  <text x="120" y="555" class="small">push失敗時のリトライループ</text>

  <rect x="1200" y="165" width="230" height="565" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="16"/>
  <text x="1230" y="205" class="txt">分担</text>
  <text x="1230" y="250" class="small">ローカルPC</text><text x="1230" y="275" class="small">記事を作る</text>
  <text x="1230" y="335" class="small">GitHub</text><text x="1230" y="360" class="small">変更履歴を保管</text>
  <text x="1230" y="420" class="small">GitHub Actions</text><text x="1230" y="445" class="small">ビルド検証</text>
  <text x="1230" y="505" class="small">Cloudflare Pages</text><text x="1230" y="530" class="small">静的サイト公開</text>
  <text x="1230" y="590" class="small">読者</text><text x="1230" y="615" class="small">CDNから高速閲覧</text>
</svg>
