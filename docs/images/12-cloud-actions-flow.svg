<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc"><title id="title">Cloud Mode GitHub Actions 処理フロー</title><desc id="desc">GitHub Actionsで記事生成からHugoビルドまで行う処理</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#7c3aed"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.step{fill:#fff;stroke:#7c3aed;stroke-width:3;rx:16}.ai{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:16}.git{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:16}.hugo{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:16}.txt{font:700 18px system-ui,sans-serif;fill:#0f172a}.code{font:600 14px ui-monospace,Consolas,monospace;fill:#334155}.arrow{stroke:#7c3aed;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs><rect class="bg" width="1500" height="1000"/><text x="60" y="65" class="title">Cloud Mode: GitHub Actions 内の処理順序</text><text x="60" y="98" class="small">docs/workflows/cloud-daily-post.yml の流れです。JST 9:00 は UTC 0:00 の cron で起動します。</text>
<rect x="90" y="155" width="300" height="90" class="step"/><text x="125" y="190" class="txt">1. schedule / manual</text><text x="125" y="218" class="code">cron: 0 0 * * *</text>
<rect x="465" y="155" width="300" height="90" class="git"/><text x="500" y="190" class="txt">2. checkout</text><text x="500" y="218" class="small">repo, history, submodule</text>
<rect x="840" y="155" width="300" height="90" class="step"/><text x="875" y="190" class="txt">3. Python / Node</text><text x="875" y="218" class="small">Python 3.12 + Node 22</text>
<rect x="90" y="335" width="300" height="110" class="ai"/><text x="125" y="372" class="txt">4. Prepare AI CLI</text><text x="125" y="400" class="code">cloud_prepare_ai_cli.sh</text><text x="125" y="424" class="small">install commands + command -v</text>
<rect x="465" y="335" width="300" height="110" class="ai"/><text x="500" y="372" class="txt">5. Generate Article</text><text x="500" y="400" class="code">cloud_generate.sh</text><text x="500" y="424" class="code">generate.py --cloud</text>
<rect x="840" y="335" width="300" height="110" class="ai"/><text x="875" y="372" class="txt">6. AI CLI subprocess</text><text x="875" y="400" class="small">claude → gemini → codex</text><text x="875" y="424" class="small">API SDKなし</text>
<rect x="90" y="535" width="300" height="110" class="git"/><text x="125" y="572" class="txt">7. Save + Commit</text><text x="125" y="600" class="small">posts/*.md + .state.json</text><text x="125" y="624" class="small">GITHUB_TOKENでpush</text>
<rect x="465" y="535" width="300" height="110" class="hugo"/><text x="500" y="572" class="txt">8. Hugo Build</text><text x="500" y="600" class="small">PaperMod確保</text><text x="500" y="624" class="code">hugo --gc --minify</text>
<rect x="840" y="535" width="300" height="110" class="hugo"/><text x="875" y="572" class="txt">9. Artifact</text><text x="875" y="600" class="small">hugo-site/public を保存</text><text x="875" y="624" class="small">ビルド結果を確認可能</text>
<rect x="465" y="740" width="300" height="110" class="hugo"/><text x="500" y="777" class="txt">10. Cloudflare</text><text x="500" y="805" class="small">GitHub連携またはDeploy Hook</text><text x="500" y="829" class="small">Pagesへ公開</text>
<path d="M390 200 L465 200" class="arrow"/><path d="M765 200 L840 200" class="arrow"/><path d="M990 245 C990 300 240 285 240 335" class="arrow"/><path d="M390 390 L465 390" class="arrow"/><path d="M765 390 L840 390" class="arrow"/><path d="M990 445 C990 505 240 490 240 535" class="arrow"/><path d="M390 590 L465 590" class="arrow"/><path d="M765 590 L840 590" class="arrow"/><path d="M990 645 C990 710 615 700 615 740" class="arrow"/>
<rect x="1185" y="155" width="250" height="695" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="16"/><text x="1218" y="195" class="txt">必要な権限</text><text x="1218" y="240" class="small">permissions:</text><text x="1218" y="265" class="code">contents: write</text><text x="1218" y="320" class="small">Secrets:</text><text x="1218" y="345" class="code">CLOUD_AI_CLI_...</text><text x="1218" y="370" class="code">CLOUDFLARE_...</text><text x="1218" y="425" class="small">安全方針:</text><text x="1218" y="450" class="small">PythonはAI APIを</text><text x="1218" y="475" class="small">直接呼ばない</text></svg>