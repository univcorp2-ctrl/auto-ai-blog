<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
<title id="title">Local Mode と Cloud Mode の二系統アーキテクチャ</title><desc id="desc">ローカルWindowsとクラウドrunnerの両方から同じgenerate.pyを実行する構成</desc>
<defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.zone{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:22}.local{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:16}.cloud{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3;rx:16}.core{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:18}.out{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:16}.txt{font:700 19px system-ui,sans-serif;fill:#0f172a}.zoneTitle{font:700 24px system-ui,sans-serif;fill:#334155}.code{font:600 15px ui-monospace,Consolas,monospace;fill:#334155}.arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}.purple{stroke:#7c3aed;stroke-width:4;fill:none;marker-end:url(#arrow)}.green{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs>
<rect class="bg" width="1500" height="980"/><text x="60" y="65" class="title">Local Mode + Cloud Mode 二系統アーキテクチャ</text><text x="60" y="98" class="small">ローカルでもクラウドでも、最終的に同じ generator/generate.py を使い、AI CLI を subprocess 経由で呼びます。</text>
<rect x="55" y="145" width="410" height="570" class="zone"/><text x="90" y="190" class="zoneTitle">Local Mode</text>
<rect x="95" y="235" width="330" height="85" class="local"/><text x="125" y="268" class="txt">Windows Task Scheduler</text><text x="125" y="294" class="small">毎日 9:00 に起動</text>
<rect x="95" y="365" width="330" height="85" class="local"/><text x="125" y="398" class="txt">run_daily.bat</text><text x="125" y="424" class="code">python generator\generate.py</text>
<rect x="95" y="495" width="330" height="105" class="local"/><text x="125" y="528" class="txt">Local AI CLI</text><text x="125" y="555" class="small">ログイン済みの claude/gemini/codex</text><text x="125" y="580" class="small">ローカルPCの認証状態を利用</text>
<rect x="545" y="145" width="410" height="570" class="zone"/><text x="580" y="190" class="zoneTitle">Cloud Mode</text>
<rect x="585" y="235" width="330" height="85" class="cloud"/><text x="615" y="268" class="txt">GitHub Actions / VM</text><text x="615" y="294" class="small">cron または手動 workflow_dispatch</text>
<rect x="585" y="365" width="330" height="85" class="cloud"/><text x="615" y="398" class="txt">cloud_prepare_ai_cli.sh</text><text x="615" y="424" class="small">CLIインストール・存在確認</text>
<rect x="585" y="495" width="330" height="105" class="cloud"/><text x="615" y="528" class="txt">cloud_generate.sh</text><text x="615" y="555" class="code">python generate.py --cloud</text><text x="615" y="580" class="small">Git author と cloud env を設定</text>
<rect x="1035" y="230" width="380" height="140" class="core"/><text x="1070" y="270" class="txt">共通コア</text><text x="1070" y="302" class="code">generator/generate.py</text><text x="1070" y="330" class="small">トピック選択、AI CLI、記事保存、push</text>
<rect x="1035" y="445" width="380" height="120" class="out"/><text x="1070" y="485" class="txt">GitHub Repository</text><text x="1070" y="515" class="small">Markdown記事と状態ファイルを保存</text><text x="1070" y="540" class="small">mainブランチへpush</text>
<rect x="1035" y="640" width="380" height="120" class="out"/><text x="1070" y="680" class="txt">Cloudflare Pages</text><text x="1070" y="710" class="small">GitHub更新またはDeploy Hookで公開</text>
<path d="M260 320 L260 365" class="arrow"/><path d="M260 450 L260 495" class="arrow"/><path d="M425 548 C575 548 845 300 1035 300" class="arrow"/>
<path d="M750 320 L750 365" class="purple"/><path d="M750 450 L750 495" class="purple"/><path d="M915 548 C995 548 980 325 1035 325" class="purple"/>
<path d="M1225 370 L1225 445" class="green"/><path d="M1225 565 L1225 640" class="green"/>
<rect x="155" y="805" width="1190" height="70" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="14"/><text x="195" y="845" class="small">ポイント: 実行場所だけを切り替え、記事生成ロジックは共通化します。Local Mode と Cloud Mode の両方で AI API 直叩きは禁止です。</text>
</svg>