<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">auto-ai-blog 全体アーキテクチャ</title>
  <desc id="desc">Windows ローカルPC、AI CLI、GitHub、Cloudflare Pages、読者までの全体処理の流れ</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <style>
      .bg{fill:#f8fafc}.zone{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;rx:24;filter:url(#shadow)}
      .box{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:16}.box2{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:16}
      .box3{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:16}.box4{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:16}
      .title{font:700 34px system-ui, sans-serif;fill:#0f172a}.zoneTitle{font:700 24px system-ui, sans-serif;fill:#334155}
      .txt{font:600 18px system-ui, sans-serif;fill:#0f172a}.small{font:500 14px system-ui, sans-serif;fill:#475569}.num{font:700 18px system-ui, sans-serif;fill:#fff}
      .arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}.note{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:12}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text x="60" y="64" class="title">Hugo + Cloudflare Pages 全自動AIブログ 全体アーキテクチャ</text>
  <text x="60" y="96" class="small">AI APIは使わず、ローカルPC上の Claude / Gemini / Codex CLI を subprocess で呼び出して記事を生成します。</text>

  <rect x="40" y="130" width="420" height="650" class="zone"/>
  <text x="70" y="175" class="zoneTitle">1. ローカル Windows PC</text>
  <rect x="80" y="215" width="320" height="72" class="box"/><text x="110" y="247" class="txt">Windows タスクスケジューラ</text><text x="110" y="270" class="small">毎日 9:00 に自動起動</text>
  <rect x="80" y="330" width="320" height="72" class="box"/><text x="110" y="362" class="txt">run_daily.bat</text><text x="110" y="385" class="small">Python 実行前に文字コードと作業場所を固定</text>
  <rect x="80" y="445" width="320" height="96" class="box2"/><text x="110" y="477" class="txt">generator/generate.py</text><text x="110" y="500" class="small">トピック選択、AI CLI実行、front matter生成</text><text x="110" y="520" class="small">git commit & push まで担当</text>
  <rect x="80" y="590" width="320" height="112" class="box3"/><text x="110" y="622" class="txt">AI CLI 群</text><text x="110" y="647" class="small">claude -p: ドラフト</text><text x="110" y="670" class="small">gemini -p: レビュー改善</text><text x="110" y="693" class="small">codex -q: 最終チェック</text>

  <rect x="520" y="130" width="360" height="650" class="zone"/>
  <text x="550" y="175" class="zoneTitle">2. Hugo サイト</text>
  <rect x="560" y="225" width="280" height="82" class="box2"/><text x="590" y="257" class="txt">content/posts/*.md</text><text x="590" y="280" class="small">生成済み記事を Markdown 保存</text>
  <rect x="560" y="365" width="280" height="82" class="box2"/><text x="590" y="397" class="txt">config.toml</text><text x="590" y="420" class="small">日本語、SEO、RSS、sitemap、PaperMod</text>
  <rect x="560" y="505" width="280" height="82" class="box2"/><text x="590" y="537" class="txt">PaperMod Theme</text><text x="590" y="560" class="small">高速・SEO対応のHugoテーマ</text>
  <rect x="560" y="645" width="280" height="82" class="box2"/><text x="590" y="677" class="txt">public/</text><text x="590" y="700" class="small">Hugo build 後の静的HTML</text>

  <rect x="940" y="130" width="420" height="650" class="zone"/>
  <text x="970" y="175" class="zoneTitle">3. GitHub / Cloudflare / 読者</text>
  <rect x="985" y="225" width="330" height="82" class="box4"/><text x="1015" y="257" class="txt">GitHub Repository</text><text x="1015" y="280" class="small">記事MarkdownとHugo設定を保存</text>
  <rect x="985" y="365" width="330" height="82" class="box4"/><text x="1015" y="397" class="txt">GitHub Actions</text><text x="1015" y="420" class="small">PythonテストとHugoビルド検証</text>
  <rect x="985" y="505" width="330" height="82" class="box3"/><text x="1015" y="537" class="txt">Cloudflare Pages</text><text x="1015" y="560" class="small">mainブランチ更新を検知して自動デプロイ</text>
  <rect x="985" y="645" width="330" height="82" class="box3"/><text x="1015" y="677" class="txt">読者・検索エンジン</text><text x="1015" y="700" class="small">CDN配信、RSS、sitemap、OGP</text>

  <path d="M240 287 L240 330" class="arrow"/><path d="M240 402 L240 445" class="arrow"/><path d="M240 541 L240 590" class="arrow"/>
  <path d="M400 493 C455 493 500 266 560 266" class="arrow"/>
  <path d="M840 266 C900 266 920 266 985 266" class="arrow"/>
  <path d="M1150 307 L1150 365" class="arrow"/><path d="M1150 447 L1150 505" class="arrow"/><path d="M1150 587 L1150 645" class="arrow"/>
  <path d="M700 307 L700 365" class="arrow"/><path d="M700 447 L700 505" class="arrow"/><path d="M700 587 L700 645" class="arrow"/>
  <path d="M985 546 C930 546 900 686 840 686" class="arrow"/>

  <rect x="52" y="805" width="1295" height="58" class="note"/>
  <text x="80" y="834" class="txt">重要ポイント</text>
  <text x="210" y="834" class="small">記事生成はローカルPC、品質確認はAI CLIの3段階、公開はGitHub push後にCloudflare Pagesが自動実行します。</text>
</svg>
