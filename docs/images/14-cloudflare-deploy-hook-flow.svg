<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850" role="img" aria-labelledby="title desc"><title id="title">Cloudflare Pages Deploy Hook 併用フロー</title><desc id="desc">GitHub pushと任意のCloudflare Deploy Hookでデプロイする流れ</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#f97316"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.git{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:16}.cf{fill:#fff7ed;stroke:#f97316;stroke-width:3;rx:16}.ok{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:16}.txt{font:700 19px system-ui,sans-serif;fill:#0f172a}.code{font:600 15px ui-monospace,Consolas,monospace;fill:#334155}.arrow{stroke:#f97316;stroke-width:4;fill:none;marker-end:url(#arrow)}.blue{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs><rect class="bg" width="1450" height="850"/><text x="60" y="65" class="title">Cloudflare Pages: push検知 + Deploy Hook の二重対応</text><text x="60" y="98" class="small">通常はGitHub連携のpush検知で十分です。より明示的にデプロイしたい場合のみ Deploy Hook を使います。</text>
<rect x="90" y="180" width="320" height="110" class="git"/><text x="125" y="220" class="txt">Cloud Mode生成完了</text><text x="125" y="250" class="small">Markdown記事をcommit</text><text x="125" y="274" class="code">git push origin main</text>
<rect x="545" y="120" width="320" height="110" class="cf"/><text x="580" y="160" class="txt">通常ルート</text><text x="580" y="190" class="small">Cloudflare PagesがGitHub更新を検知</text><text x="580" y="214" class="small">自動ビルド開始</text>
<rect x="545" y="335" width="320" height="120" class="cf"/><text x="580" y="375" class="txt">任意ルート</text><text x="580" y="405" class="code">curl -X POST deploy hook</text><text x="580" y="430" class="small">Secretがある場合だけ実行</text>
<rect x="1000" y="230" width="320" height="130" class="ok"/><text x="1035" y="270" class="txt">Cloudflare Pages Build</text><text x="1035" y="300" class="small">PaperMod確保</text><text x="1035" y="324" class="code">hugo --gc --minify</text>
<rect x="1000" y="515" width="320" height="110" class="ok"/><text x="1035" y="555" class="txt">公開</text><text x="1035" y="585" class="small">CDN、RSS、sitemap、OGP</text>
<path d="M410 235 C480 235 480 175 545 175" class="blue"/><path d="M410 235 C480 235 480 395 545 395" class="arrow"/><path d="M865 175 C950 175 935 295 1000 295" class="blue"/><path d="M865 395 C950 395 935 300 1000 300" class="arrow"/><path d="M1160 360 L1160 515" class="arrow"/>
<rect x="90" y="670" width="1230" height="65" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="14"/><text x="125" y="710" class="small">Deploy Hook URL は Secret に保存します。リポジトリに実URLを書かないことで、外部から勝手にデプロイされるリスクを下げます。</text></svg>