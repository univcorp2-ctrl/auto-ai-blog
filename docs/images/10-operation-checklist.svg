<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="980" viewBox="0 0 1450 980" role="img" aria-labelledby="title desc">
  <title id="title">初期設定と運用チェックリスト</title>
  <desc id="desc">ローカルセットアップ、手動実行、タスクスケジューラ、Cloudflare Pages、本番運用の順番</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.step{fill:#ffffff;stroke:#2563eb;stroke-width:3;rx:18}.done{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:18}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:18}.txt{font:700 19px system-ui,sans-serif;fill:#0f172a}.code{font:600 15px ui-monospace,Consolas,monospace;fill:#334155}.arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}.num{fill:#2563eb}.numText{font:700 18px system-ui,sans-serif;fill:white}</style></defs>
  <rect class="bg" width="1450" height="980"/>
  <text x="60" y="65" class="title">初期設定から毎日運用までのチェックリスト</text>
  <text x="60" y="98" class="small">初回だけ必要な作業と、毎日自動で動く部分を分けて確認できます。</text>

  <circle cx="105" cy="175" r="24" class="num"/><text x="99" y="182" class="numText">1</text>
  <rect x="145" y="135" width="520" height="105" class="step"/><text x="180" y="172" class="txt">GitHub から clone</text><text x="180" y="202" class="code">G:\マイドライブ\AI_Agents\github\repos\auto-ai-blog</text><text x="180" y="225" class="small">PaperMod は submodule または clone fallback で取得</text>
  <path d="M665 187 L775 187" class="arrow"/>

  <circle cx="815" cy="175" r="24" class="num"/><text x="809" y="182" class="numText">2</text>
  <rect x="855" y="135" width="520" height="105" class="step"/><text x="890" y="172" class="txt">Hugo Extended / Python / AI CLI</text><text x="890" y="202" class="small">Hugo、Python 3.12、claude/gemini/codex を用意</text><text x="890" y="225" class="small">AI CLIはローカルでログイン済みにする</text>

  <circle cx="105" cy="365" r="24" class="num"/><text x="99" y="372" class="numText">3</text>
  <rect x="145" y="325" width="520" height="105" class="done"/><text x="180" y="362" class="txt">手動実行テスト</text><text x="180" y="392" class="code">.\run_daily.bat</text><text x="180" y="415" class="small">記事が posts に保存され、git push できるか確認</text>
  <path d="M1015 240 C1015 300 405 285 405 325" class="arrow"/>
  <path d="M665 377 L775 377" class="arrow"/>

  <circle cx="815" cy="365" r="24" class="num"/><text x="809" y="372" class="numText">4</text>
  <rect x="855" y="325" width="520" height="105" class="done"/><text x="890" y="362" class="txt">タスクスケジューラ登録</text><text x="890" y="392" class="small">毎日9:00に run_daily.bat を起動</text><text x="890" y="415" class="code">Register-ScheduledTask -TaskName auto-ai-blog</text>

  <circle cx="105" cy="555" r="24" class="num"/><text x="99" y="562" class="numText">5</text>
  <rect x="145" y="515" width="520" height="105" class="warn"/><text x="180" y="552" class="txt">Cloudflare Pages 接続</text><text x="180" y="582" class="small">GitHub repo を選択し、Hugo build command を設定</text><text x="180" y="605" class="code">Output: hugo-site/public</text>
  <path d="M1015 430 C1015 500 405 475 405 515" class="arrow"/>
  <path d="M665 567 L775 567" class="arrow"/>

  <circle cx="815" cy="555" r="24" class="num"/><text x="809" y="562" class="numText">6</text>
  <rect x="855" y="515" width="520" height="105" class="warn"/><text x="890" y="552" class="txt">baseURL / GA / 独自ドメイン</text><text x="890" y="582" class="small">Cloudflare Pages URL決定後に config.toml を更新</text><text x="890" y="605" class="small">Google Analytics は空欄のままでも動作</text>

  <circle cx="105" cy="745" r="24" class="num"/><text x="99" y="752" class="numText">7</text>
  <rect x="145" y="705" width="520" height="105" class="done"/><text x="180" y="742" class="txt">毎日運用</text><text x="180" y="772" class="small">PC起動中にタスクが実行され、記事生成・push</text><text x="180" y="795" class="small">Cloudflare Pages が自動公開</text>
  <path d="M1015 620 C1015 685 405 665 405 705" class="arrow"/>
  <path d="M665 757 L775 757" class="arrow"/>

  <circle cx="815" cy="745" r="24" class="num"/><text x="809" y="752" class="numText">8</text>
  <rect x="855" y="705" width="520" height="105" class="step"/><text x="890" y="742" class="txt">メンテナンス</text><text x="890" y="772" class="small">topics.yaml にテーマ追加、config.yaml で文字数調整</text><text x="890" y="795" class="small">ログと Cloudflare deploy history を確認</text>

  <rect x="145" y="870" width="1230" height="55" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="14"/>
  <text x="180" y="904" class="small">本番運用では「ローカルPCが起動していること」「AI CLIがログイン済みであること」「git pushできること」が重要です。</text>
</svg>
