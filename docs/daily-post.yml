name: Daily Hugo Build Check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Python static check
        run: ruff check .

      - name: Python tests
        run: pytest

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Ensure PaperMod theme
        run: |
          git submodule update --init --recursive || true
          if [ ! -d "hugo-site/themes/PaperMod" ]; then
            git clone --depth=1 https://github.com/adityatelange/hugo-PaperMod.git hugo-site/themes/PaperMod
          fi

      - name: Build Hugo site
        run: hugo --source hugo-site --gc --minify

      - name: Upload Hugo public artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public
          path: hugo-site/public
