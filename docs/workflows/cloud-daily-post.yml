name: Cloud Daily AI Post

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without committing or pushing'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read

concurrency:
  group: cloud-daily-ai-post
  cancel-in-progress: false

jobs:
  generate-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLOG_EXECUTION_MODE: cloud
      BLOG_GIT_BRANCH: main
      CLOUD_AI_CLI_INSTALL_COMMANDS: ${{ secrets.CLOUD_AI_CLI_INSTALL_COMMANDS }}
      CLOUDFLARE_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
      CLAUDE_CONFIG: ${{ secrets.CLAUDE_CONFIG }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js for AI CLIs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare AI CLIs
        run: bash scripts/cloud_prepare_ai_cli.sh

      - name: Generate article in cloud
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: bash scripts/cloud_generate.sh

      - name: Dry-run generation check
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: python generator/generate.py --cloud --dry-run

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Ensure PaperMod theme
        run: |
          git submodule update --init --recursive || true
          if [ ! -d "hugo-site/themes/PaperMod" ]; then
            git clone --depth=1 https://github.com/adityatelange/hugo-PaperMod.git hugo-site/themes/PaperMod
          fi

      - name: Build Hugo site
        run: hugo --source hugo-site --gc --minify

      - name: Upload Hugo public artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public-cloud
          path: hugo-site/public

      - name: Trigger Cloudflare Pages deploy hook when configured
        if: ${{ env.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK_URL"
